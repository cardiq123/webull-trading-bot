[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webull-bot"
version = "0.1.0"
description = "Research-driven US stock day and swing trading bot with a Webull OpenAPI adapter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "requests>=2.31",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
broker = ["webull-openapi-python-sdk>=0.1.0"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
webull-bot = "webull_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
